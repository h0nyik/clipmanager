name: Release

on:
  push:
    tags:
      - 'v*.*.*'   # v1.2.0 → release, v1.2.0-beta.1 → pre-release

permissions:
  contents: write  # needed to create GitHub Release

jobs:
  release:
    name: Build & Release (Universal)
    runs-on: macos-15

    env:
      # Optional — set these secrets in repo Settings → Secrets. Without them the app is ad-hoc signed.
      CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
      NOTARIZE_APPLE_ID: ${{ secrets.NOTARIZE_APPLE_ID }}
      NOTARIZE_TEAM_ID:  ${{ secrets.NOTARIZE_TEAM_ID }}
      NOTARIZE_PASSWORD: ${{ secrets.NOTARIZE_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          # Info.plist gets the numeric part only (1.2.0-beta.1 → 1.2.0)
          echo "PLIST_VERSION=${VERSION%%-*}" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "PRERELEASE=true" >> "$GITHUB_OUTPUT"
          else
            echo "PRERELEASE=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Developer ID certificate
        if: env.CODESIGN_IDENTITY != ''
        run: |
          echo "${{ secrets.CODESIGN_CERT_P12_B64 }}" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "${{ secrets.CODESIGN_CERT_PASSPHRASE }}" -T /usr/bin/codesign
          security list-keychains -s build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          rm /tmp/cert.p12

      - name: Build universal .app
        run: bash Scripts/build-app.sh release universal
        env:
          CLIPMANAGER_VERSION: ${{ steps.version.outputs.PLIST_VERSION }}

      - name: Create DMG
        run: bash Scripts/create-dmg.sh
        env:
          CLIPMANAGER_VERSION: ${{ steps.version.outputs.VERSION }}

      - name: Notarize DMG
        if: env.NOTARIZE_APPLE_ID != '' && env.CODESIGN_IDENTITY != ''
        run: |
          DMG="build/ClipManager-${{ steps.version.outputs.VERSION }}.dmg"
          xcrun notarytool submit "$DMG" \
            --apple-id "$NOTARIZE_APPLE_ID" \
            --team-id  "$NOTARIZE_TEAM_ID" \
            --password "$NOTARIZE_PASSWORD" \
            --wait
          xcrun stapler staple "$DMG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ClipManager ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: ${{ steps.version.outputs.PRERELEASE }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Instalace
            1. Stáhni `ClipManager-${{ steps.version.outputs.VERSION }}.dmg`, otevři ho a přetáhni ClipManager do Aplikací.
            2. Pokud build není notarizovaný, macOS první spuštění zablokuje. Otevři **Nastavení systému → Soukromí a zabezpečení** a klikni na **Přesto otevřít**.
               Případně v Terminálu: `xattr -dr com.apple.quarantine /Applications/ClipManager.app`
            3. Pro automatické vkládání povol ClipManager v **Soukromí a zabezpečení → Přístupnost**.
               Při přechodu z předchozí verze ho tam nejdřív odeber (−) a přidej znovu, jinak oprávnění nezabere.
          files: |
            build/ClipManager-${{ steps.version.outputs.VERSION }}.dmg
