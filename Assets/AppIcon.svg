<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- ClipManager app icon · © 2025–2026 h0nyik · jeKral.cz -->
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#8B6CFF"/>
      <stop offset="0.55" stop-color="#5B5BF0"/>
      <stop offset="1" stop-color="#2F6BEA"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.16" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9EDFF"/>
    </linearGradient>
    <linearGradient id="clip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A3F8F"/>
      <stop offset="1" stop-color="#1F2260"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB547"/>
      <stop offset="1" stop-color="#FF5C7A"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#14104A" flood-opacity="0.35"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#14104A" flood-opacity="0.25"/>
    </filter>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
  </defs>

  <!-- Body -->
  <g filter="url(#iconShadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <!-- History stack (back cards) -->
  <g transform="rotate(-12 512 560)" filter="url(#softShadow)">
    <rect x="292" y="300" width="440" height="520" rx="54" fill="#FFFFFF" opacity="0.28"/>
  </g>
  <g transform="rotate(-5.5 512 560)" filter="url(#softShadow)">
    <rect x="292" y="300" width="440" height="520" rx="54" fill="#FFFFFF" opacity="0.5"/>
  </g>

  <!-- Front card -->
  <g filter="url(#shadow)">
    <rect x="292" y="300" width="440" height="520" rx="54" fill="url(#paper)"/>
  </g>

  <!-- Text lines -->
  <rect x="352" y="420" width="250" height="34" rx="17" fill="url(#accent)"/>
  <rect x="352" y="490" width="320" height="26" rx="13" fill="#C9D0F5"/>
  <rect x="352" y="546" width="285" height="26" rx="13" fill="#C9D0F5"/>
  <rect x="352" y="602" width="300" height="26" rx="13" fill="#C9D0F5"/>
  <rect x="352" y="658" width="190" height="26" rx="13" fill="#DCE1FA"/>

  <!-- Clip -->
  <g filter="url(#softShadow)">
    <rect x="417" y="258" width="190" height="88" rx="30" fill="url(#clip)"/>
  </g>
  <rect x="467" y="282" width="90" height="26" rx="13" fill="#E9EDFF" opacity="0.9"/>
  <rect x="419" y="260" width="186" height="20" rx="10" fill="#FFFFFF" opacity="0.12"/>

  <!-- History badge -->
  <g filter="url(#shadow)">
    <circle cx="700" cy="740" r="104" fill="url(#badge)"/>
  </g>
  <circle cx="700" cy="740" r="102" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="3"/>
  <!-- counter-clockwise arrow around a clock -->
  <g fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <path d="M638 717.4 A 66 66 0 1 1 642.8 773"/>
    <path d="M700 702 L700 744 L728 762"/>
  </g>
  <path d="M628.4 745 L664 716.2 L618.8 699.8 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round"/>
</svg>
